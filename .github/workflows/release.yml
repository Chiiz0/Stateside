name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests & build Release APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Verify 16KB alignment & prepare release assets
        run: |
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name "zipalign" | sort -V | tail -n 1)
          "$ZIPALIGN" -c -P 16 4 app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Stateside-${GITHUB_REF_NAME}-release.apk"
          (cd dist && sha256sum "Stateside-${GITHUB_REF_NAME}-release.apk" > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Stateside-${{ github.ref_name }}-release.apk
            dist/SHA256SUMS.txt
